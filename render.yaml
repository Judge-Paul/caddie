# One public web service plus one background worker for Telegram long polling.
# Both use the same production image. Keep exactly one worker instance.
envVarGroups:
  - name: caddie
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: caddie
      - key: BETTER_AUTH_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_KEY
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false

services:
  - type: web
    name: caddie
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: caddie

  - type: worker
    name: caddie-telegram
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bun server/telegram/index.ts
    plan: standard
    autoDeploy: true
    envVars:
      - fromGroup: caddie
